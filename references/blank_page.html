    <script>
        /**
         * @description: 
         * @return {*}
         * @param {*} fileName  文件名
         * @param {*} path  文件路径
         * @param {*} insertTimeout  获取到前缀后多长时间插入
         * @param {*} retryCount  重试次数
         */
        function asyncAppendNode(fileName, path, insertTimeout, retryCount) {
            var time = null;
            var count = 0;
            // css，js文件地址
            function createUrl() {
                return window.cdnPath + path + '/' + fileName
            }
            function insert() {
                var tagName = 'link'
                if (/.js/.test(fileName)) {
                    tagName = 'script'
                }
                var node = document.createElement(tagName)
                if (tagName === 'link') {
                    node.type = 'text/css'
                    node.rel = 'stylesheet'
                    node.href = createUrl()
                    document.head.appendChild(node)
                } else {
                    node.src = createUrl()
                    document.head.appendChild(node)
                }
            }

            function startTask() {
                count++;
                time && clearTimeout(time);
                if (window.cdnPath) {
                    setTimeout(() => {
                        console.log((insertTimeout || 200) + 'ms后插入')
                        insert()
                    }, insertTimeout || 200)
                } else {
                    if (!retryCount || retryCount > count) {
                        time = setTimeout(() => {
                            startTask()
                        }, 200)
                    }
                }
            }
            startTask()
        }
    </script>
